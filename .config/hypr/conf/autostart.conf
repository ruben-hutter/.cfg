# ----------------------------------------------------- 
# Autostart
# ----------------------------------------------------- 
exec-once = kanshi

exec-once = $HOME/.config/hypr/scripts/wallpaper.sh
exec-once = hyprpaper

exec-once = $HOME/.config/hypr/scripts/xdg.sh
exec-once = dunst
#exec-once = wl-paste --watch cliphist store

exec-once = QT_QPA_PLATFORM=xcb $HOME/.local/bin/kDrive
