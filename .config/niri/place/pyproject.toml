# Dev tooling manifest only — the runtime (daemon + overlay) runs on the
# system python3: place.py/layout.py/niri.py are stdlib-only, and the GTK
# overlay uses Fedora's python3-gobject. Nothing in this file is needed at
# runtime; a fresh machine runs the scripts with plain `python3`.
[project]
name = "place"
version = "0.1.0"
description = "Keep niri workspaces arranged by monitor role across setup changes"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
]

[tool.uv]
package = false
