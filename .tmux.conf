set -ga terminal-overrides ",xterm-256color*:Tc"
set-option -g default-terminal "screen-256color"
set-window-option -g window-style bg=terminal
set-window-option -g window-active-style bg=terminal

set-environment -g COLORTERM truecolor
set-environment -g PATH "$HOME/.local/bin:$PATH"
set-environment -g PATH "$HOME/.cargo/bin:$PATH"

set -s escape-time 0

# pass modified keys (Alt+Enter etc.) through to TUIs like pi
set -s extended-keys on
set -s extended-keys-format csi-u

set -g base-index 1
set -g renumber-windows on

set -g default-shell /usr/bin/bash
set -g default-command /usr/bin/zsh

# Set prefix key to C-a
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Set key bindings for splitting panes
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Set key to reload config
unbind r
bind r source-file ~/.tmux.conf

# Set key to switch panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection

bind i run-shell "tmux neww /home/ruben/scripts/cht.sh"
bind -n M-f display-popup -E -w 60% -h 60% /home/ruben/scripts/tmux_session_manager.sh
bind -n M-q display-popup -E -w 60% -h 60% /home/ruben/scripts/pi_attention_queue.sh

# walrus time tracking via session lifecycle hooks (see tmux_walrus_hook.sh)
# client-session-changed and session-closed CHAIN the pi attention-queue hook
# (~/scripts/pi_attention_hook.sh) — tmux hook options are single-valued, so a
# second set-hook would silently replace walrus, and a tmux-level `\;` chain
# DOES NOT WORK (verified live: only the first run-shell executes). Instead both
# scripts run inside ONE run-shell, separated by a shell-level `;` — keeps -b
# background semantics and the hook format expansion. Hook identity is passed as
# ARGS via '#{...}' expansion: hook vars are NOT in run-shell env, and
# #{hook_session} is an unrelated counter (verified live). Reliable formats:
# #{hook_pane} (pane id) and #{hook_session_name}.
set-hook -g client-session-changed "run-shell -b '/home/ruben/scripts/tmux_walrus_hook.sh ; /home/ruben/scripts/pi_attention_hook.sh client-session-changed #{hook_session_name}'"
set-hook -g client-attached        "run-shell -b '/home/ruben/scripts/tmux_walrus_hook.sh'"
set-hook -g client-detached        "run-shell -b '/home/ruben/scripts/tmux_walrus_hook.sh'"
set-hook -g session-closed         "run-shell -b '/home/ruben/scripts/tmux_walrus_hook.sh ; /home/ruben/scripts/pi_attention_hook.sh session-closed #{hook_session_name}'"

# pi attention queue: dequeue-on-view and drop-dead-work hooks (see pi_attention_queue.sh).
# EXCLUSIVE to this feature (walrus does not use these).
# SCOPE MATTERS: pane-focus-in/pane-died/pane-exited are WINDOW-scope hooks —
# they only register with -gw; plain -g exits 0 but silently does nothing.
# pane-focus-in additionally requires `focus-events on` and an ATTACHED client
# (no client, no focus) to ever fire.
# ARGUMENTS GO INSIDE THE QUOTED SHELL COMMAND. A value like
#   run-shell -b 'script' arg1 arg2
# makes tmux treat arg1/arg2 as run-shell #{1}/#{2} substitution arguments —
# the script's argv stays EMPTY (this exact mistake silently no-oped every
# pane hook once already). Everything the script needs must be inside the
# quotes, where #{...} expands into the shell command itself.
set -g focus-events on
set-hook -gw pane-focus-in   "run-shell -b '/home/ruben/scripts/pi_attention_hook.sh pane-focus-in #{hook_pane}'"
set-hook -gw pane-died       "run-shell -b '/home/ruben/scripts/pi_attention_hook.sh prune-dead-panes'"
set-hook -gw pane-exited     "run-shell -b '/home/ruben/scripts/pi_attention_hook.sh prune-dead-panes'"
set-hook -g after-kill-pane  "run-shell -b '/home/ruben/scripts/pi_attention_hook.sh prune-dead-panes'"
# window-closed fires for kill-window / session close / last pane exit.
set-hook -g window-closed    "run-shell -b '/home/ruben/scripts/pi_attention_hook.sh prune-dead-panes'"

unbind -T copy-mode-vi MouseDragEnd1Pane

# catppuccin theme
set -g @catppuccin_flavour 'mocha' # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
#set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions
set -g @plugin 'tmux-plugins/tmux-yank'

#set -g @themepack 'powerline/default/blue'
set -g status on

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
#set -g @continuum-boot 'on'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
